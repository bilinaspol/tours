<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игры · BilinaSpol</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#17363a;background:#f4f1e9}*{box-sizing:border-box}body{margin:0}header{background:#123d47;color:#fff;padding:22px 16px}header .wrap,main{max-width:560px;margin:auto}h1{font-size:clamp(26px,6vw,38px);margin:8px 0 0}main{padding:16px 14px 80px}section,.match{background:#fff;border:1px solid #d4ddd7;border-radius:16px;padding:16px;margin:0 0 16px;box-shadow:0 4px 18px #17363a0c}h2{margin:0 0 15px;font-size:22px}h3{margin:16px 0 10px;font-size:18px;color:#22545a}.muted{color:#5d7476}.team{font-weight:700;overflow-wrap:anywhere}.teams{display:block}.vs{display:none}.teams .team:last-child{border-top:1px solid #e5e5e5;padding-top:8px;margin-top:8px}.score{font-size:22px;font-weight:800;color:#086562;margin:9px 0}.match-date{font-size:14px;color:#536d70}.match-title{font-size:13px;font-weight:700;color:#41656a;margin-top:2px}label{display:block;font-weight:650;font-size:14px}input,textarea,button{font:inherit;min-height:44px;border-radius:10px}input,textarea{width:100%;min-width:0;padding:9px;border:1px solid #9eaead;margin:5px 0 10px;background:#fff}textarea{resize:vertical;min-height:65px}button{background:#176b70;color:white;border:0;padding:10px 14px;cursor:pointer;font-weight:700}button:disabled{opacity:.55}.secondary{background:#e4eded;color:#17363a}.fields{display:grid;grid-template-columns:minmax(0,106px) minmax(0,1fr);gap:9px;align-items:end}.fields label{min-width:0}.fields input{font-size:14px}.title-row{display:flex;gap:8px;align-items:end}.title-row label{flex:1;min-width:0}.title-row button{margin:0 0 10px;white-space:nowrap;font-size:13px}.error{color:#9b2d25}.success{color:#146d43}.log{border-top:1px solid #eee;margin:11px 0 0;padding:9px 0 0;color:#60767b;font-size:12px;list-style:none}.log li{margin:4px 0}.hint{font-size:13px;color:#506d70}.subhead{border-left:4px solid #176b70;padding-left:10px}a{color:#176b70}header a{color:#cce7e2}@media(max-width:480px){.title-row{display:block}.title-row button{margin:-4px 0 14px}.fields{grid-template-columns:minmax(0,1fr)}.fields input{font-size:16px}}
</style>
</head>
<body>
<header><div class="wrap"><a href="./">← BilinaSpol</a><h1>Игры турнира</h1></div></header>
<main>
<p id="status" role="status" class="muted">Загрузка игр…</p>
<section id="join" hidden><p>Чтобы записывать игры и счёт, нужен доступ редактора.</p><button type="button" id="join-button">Отправить заявку администратору</button><p id="join-state" class="hint"></p></section>
<section id="create" hidden>
  <form id="new-match">
    <label>Команда А: один или два игрока, каждый с новой строки<textarea name="a" required placeholder="Имя игрока 1&#10;Имя игрока 2"></textarea></label>
    <label>Команда Б: один или два игрока, каждый с новой строки<textarea name="b" required placeholder="Имя игрока 1&#10;Имя игрока 2"></textarea></label>
    <div class="fields">
      <label>Счёт<input name="score" inputmode="text" placeholder="11:9, 11:7" autocomplete="off"></label>
      <label>Дата и время (МСК)<input name="playedAt" type="datetime-local" required></label>
    </div>
    <div class="title-row"><label>Турнир<input name="tournament" maxlength="100" required></label><button type="button" class="secondary" id="save-default">Запомнить турнир</button></div>
    <button type="submit">Добавить матч</button>
  </form>
</section>
<section><h2>Игры</h2><div id="matches" aria-live="polite"></div></section>
<p id="admin-link" hidden><a href="./admin.html">Управление редакторами →</a></p>
</main>
<script>
'use strict';
const API='https://tours.multirate.cc/api';
const initData=window.Telegram?.WebApp?.initData || '';
const $=id=>document.getElementById(id);
const text=(tag,value,cls)=>{const el=document.createElement(tag);el.textContent=value;if(cls)el.className=cls;return el};
const names=value=>value.split('\n').map(x=>x.trim()).filter(Boolean);
let role='viewer', config={defaultTournament:'Отбор 8-11 Окт. на Euro Open',rev:null};
if(initData)window.Telegram.WebApp.ready();
function message(value,kind='muted'){$('status').textContent=value;$('status').className=kind}
function errorMessage(data,status){
  const messages={stale_revision:'Игра изменилась. Обновите страницу.',telegram_required:'Нужна свежая сессия Telegram. Переоткройте Mini App.',admin_required:'Доступ только администратору.',editor_required:'Нет доступа редактора или истекла сессия Telegram.',username_required:'Добавьте @username в профиль Telegram и переоткройте Mini App.',invalid_score:'Проверьте счёт: целые числа, без ничьих.',invalid_played_at:'Проверьте дату и время.',invalid_tournament:'Проверьте название турнира.',admin_score_required:'Счёт уже внесён; исправить его может администратор.'};
  return messages[data?.error]||`Ошибка сервера (${status}).`;
}
async function api(method,path,body){
  const response=await fetch(API+path,{method,cache:'no-store',headers:{...(body!==undefined?{'Content-Type':'application/json'}:{}),...(initData?{'X-Telegram-Init-Data':initData}:{})},body:body===undefined?undefined:JSON.stringify(body)});
  const data=await response.json();if(!response.ok)throw Error(errorMessage(data,response.status));return data;
}
function mskInput(date=new Date()) {return new Date(date.getTime()+3*3600*1000).toISOString().slice(0,16)}
function toIso(value){if(!/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(value))throw Error('Проверьте дату и время (МСК).');const d=new Date(value+':00+03:00');if(Number.isNaN(d.getTime())||mskInput(d)!==value)throw Error('Проверьте дату и время (МСК).');return d.toISOString()}
function shortDate(value){const d=new Date(value);if(Number.isNaN(d.getTime()))return 'Дата не указана';return new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Europe/Moscow'}).format(d).replace(',','')}
function parseScore(value){const input=value.trim();if(!input)return [];return input.split(',').map(part=>{const match=/^\s*(\d{1,2})\s*:\s*(\d{1,2})\s*$/.exec(part);if(!match)throw Error('Укажите счёт через запятую: 11:9, 11:7');return {a:Number(match[1]),b:Number(match[2])}})}
const fmtScore=sets=>sets.map(s=>`${s.a}:${s.b}`).join(', ');
async function saveDefault(title){
  const value=title.trim();if(!value||value.length>100)throw Error('Укажите название турнира (до 100 символов).');
  if(config.defaultTournament===value)return;
  let current=config;
  for(let attempt=0;attempt<2;attempt++){
    try{current=await api('PUT','/config',{rev:current.rev,defaultTournament:value});config=current;return}
    catch(err){if(attempt)throw err;current=await api('GET','/config');if(current.defaultTournament===value){config=current;return}}
  }
}
function eventLabel(action){return {created:'добавил игру',score_updated:'изменил счёт',metadata_updated:'изменил дату или турнир',match_updated:'изменил игру'}[action]||action}
function eventDetails(details){
  if(!details)return '';
  const label={sets:'счёт',playedAt:'дата',tournament:'турнир',teamA:'команда А',teamB:'команда Б'};
  const show=(key,value)=>key==='sets'?(value?.length?fmtScore(value):'—'):key==='playedAt'?(value?shortDate(value):'—'):Array.isArray(value)?value.join(' / '):(value||'—');
  return Object.entries(details).filter(([key])=>label[key]).map(([key,diff])=>`${label[key]}: ${diff.before===undefined?'':show(key,diff.before)+' → '}${show(key,diff.after)}`).join('; ');
}
function renderMatch(m){
  const card=text('article','','match');const teams=text('div','','teams');
  teams.append(text('div',m.teamA.join(' / '),'team'),text('span','против','vs'),text('div',m.teamB.join(' / '),'team'));
  const playedAt=m.playedAt||m.log?.[0]?.at||m.updatedAt;
  card.append(teams,text('div',m.sets.length?m.sets.map(s=>`${s.a}:${s.b}`).join(' · '):'Счёт ещё не внесён','score'),text('div',shortDate(playedAt),'match-date'),text('div',m.tournament||'Не указан','match-title'));
  const log=text('ul','','log');for(const e of m.log||[]){const detail=eventDetails(e.details);log.append(text('li',`${shortDate(e.at)} · ${e.by} · ${eventLabel(e.action)}${detail?' · '+detail:''}`))}card.append(log);return card;
}
async function load(){
  try{
    const data=await api('GET','/matches');const root=$('matches');
    const when=m=>new Date(m.playedAt||m.log?.[0]?.at||m.updatedAt).getTime()||0;
    const list=data.matches.sort((a,b)=>when(b)-when(a)||a.id.localeCompare(b.id));root.replaceChildren();
    if(!list.length)root.append(text('p','Игр пока нет.','muted'));
    let previous=null;
    for(const match of list){const title=match.tournament||'Не указан';if(title!==previous)root.append(text('h3',title,'subhead'));root.append(renderMatch(match));previous=title}
    if($('status').textContent==='Загрузка игр…')message('Обновлено.');
  }catch(err){message(`Не удалось загрузить игры: ${err.message}`,'error')}
}
async function identity(){
  if(!initData)return;
  try{
    const me=await api('GET','/me');role=me.role;
    if(role==='admin')sessionStorage.setItem('tours-admin-init-data',initData);else sessionStorage.removeItem('tours-admin-init-data');
    $('create').hidden=!(role==='admin'||role==='editor');$('join').hidden=!(role==='viewer'||role==='pending');$('admin-link').hidden=role!=='admin';
    if(role==='pending'){$('join-button').hidden=true;$('join-state').textContent='Заявка ожидает решения администратора.'}
    if(role==='viewer'&&!me.username)$('join-state').textContent='Для заявки сначала укажите @username в профиле Telegram.';
    await load();
  }catch(err){message(err.message,'error')}
}
$('join-button').addEventListener('click',async e=>{e.currentTarget.disabled=true;try{await api('POST','/join',{});$('join-button').hidden=true;$('join-state').textContent='Заявка отправлена. Попросите администратора одобрить её.'}catch(err){message(err.message,'error');e.currentTarget.disabled=false}});
$('save-default').addEventListener('click',async e=>{e.currentTarget.disabled=true;try{await saveDefault($('new-match').elements.tournament.value);message('Название турнира сохранено по умолчанию.','success')}catch(err){message(err.message,'error')}finally{e.currentTarget.disabled=false}});
$('new-match').addEventListener('submit',async e=>{
  e.preventDefault();const form=e.currentTarget,btn=form.querySelector('button[type="submit"]');btn.disabled=true;
  try{
    const teamA=names(form.elements.a.value),teamB=names(form.elements.b.value);
    if(teamA.length<1||teamA.length>2||teamB.length<1||teamB.length>2)throw Error('Укажите одного или двух игроков в каждой команде.');
    const tournament=form.elements.tournament.value.trim();const sets=parseScore(form.elements.score.value);
    await api('POST','/matches',{teamA,teamB,sets,tournament,playedAt:toIso(form.elements.playedAt.value)});
    form.elements.a.value='';form.elements.b.value='';form.elements.score.value='';form.elements.playedAt.value=mskInput();
    try{await saveDefault(tournament);message('Игра добавлена.','success')}
    catch(err){message(`Игра добавлена, но название по умолчанию не обновилось: ${err.message}`,'error')}
    await load();
  }catch(err){message(err.message,'error')}finally{btn.disabled=false}
});
$('new-match').elements.playedAt.value=mskInput();
api('GET','/config').then(data=>{config=data;$('new-match').elements.tournament.value=data.defaultTournament}).catch(err=>message(`Настройки недоступны: ${err.message}`,'error'));
load();identity();setInterval(()=>{load();if(role==='pending')identity()},15000);
</script>
</body>
</html>
